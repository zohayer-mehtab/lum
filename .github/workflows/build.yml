name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      # APK first so a failing unit test never blocks getting the app.
      - run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: lumen-debug-apk, path: app/build/outputs/apk/debug/*.apk }
      - run: gradle --no-daemon :core:test
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: test-reports, path: core/build/reports/tests }
